<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#160c0b">
<meta property="og:title" content="Floor Inspectors — WoW Forever">
<meta property="og:description" content="The Horde is gathering. Countdown to WoW Forever.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://rickors91-droid.github.io/floor-inspectors-forever/assets/floor-inspectors-banner.svg">
<title>Floor Inspectors — WoW Forever</title>
<style>
:root{color-scheme:dark;--gold:#e6c17b;--red:#8e2525;--ink:#100909}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#57251d 0,#24100f 48%,#090707 100%);color:#f7e8cc;font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;opacity:.16;background:repeating-linear-gradient(135deg,transparent 0 8px,#d6a65b 9px,transparent 10px 20px);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);pointer-events:none}
.wrap{width:min(900px,100%);text-align:center;position:relative;border:1px solid #b8894a;padding:clamp(24px,5vw,56px);background:linear-gradient(180deg,#1b0d0de8,#0d0808f5);box-shadow:0 0 0 7px #170b0b,0 0 0 8px #704a2c,0 28px 90px #000}
.kicker{letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-size:12px}.banner{display:block;width:100%;height:auto;max-height:390px;object-fit:contain;margin:18px auto 22px;border:1px solid #9e7143;box-shadow:0 0 24px #000b}.crest{display:none}
h1{font-size:clamp(35px,7vw,66px);line-height:.98;margin:10px 0;color:#f1d39a;text-shadow:0 3px 0 #4d1714,0 0 26px #c47a39aa;letter-spacing:.04em}
.sub{color:#d5b995;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(11px,2vw,15px);margin:16px 0 34px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#b8894a,transparent);margin:24px 0}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 auto;max-width:700px}
.unit{padding:18px 8px;border:1px solid #76502f;background:linear-gradient(#291312,#120a0a);box-shadow:inset 0 0 22px #0008}
.num{font-family:Arial,sans-serif;font-variant-numeric:tabular-nums;font-size:clamp(34px,7vw,64px);font-weight:800;color:#fff0cf;text-shadow:0 0 18px #bc753b88}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);margin-top:7px}
.status{font-size:clamp(16px,3vw,22px);color:#edcf9c;margin:28px 0 8px}
.target{font-size:13px;color:#b99b77;letter-spacing:.08em}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
button{border:1px solid var(--gold);background:#6e1e1a;color:#ffe6bd;padding:13px 18px;font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover{background:#922b24}
.foot{margin-top:34px;color:#9f8062;font-size:12px;letter-spacing:.12em}
@media(max-width:520px){.timer{grid-template-columns:repeat(2,1fr)}.banner{margin:14px auto 18px}}
</style>
</head>
<body>
<main class="wrap">
<div class="kicker">A Horde guild announcement</div>
<img class="banner" src="assets/floor-inspectors-banner.svg" alt="A crimson-bannered fortress beneath the moon">
<div class="kicker">Floor Inspectors present</div>
<h1>WOW FOREVER</h1>
<div class="sub">The wait is nearly over. The Horde is gathering.</div>
<div class="rule"></div>
<div class="timer" aria-live="off">
<div class="unit"><div class="num" id="days">--</div><div class="label">Days</div></div>
<div class="unit"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
<div class="unit"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
<div class="unit"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
</div>
<div class="status" id="status">Sharpen your blades.</div>
<div class="target">NOVEMBER 4, 2026 · 23:00 GMT</div>
<div class="rule"></div>
<div class="actions">
<button id="copyLink">Copy countdown link</button>
<button id="copyDiscord">Copy Discord announcement</button>
</div>
<div class="foot">FLOOR INSPECTORS · HORDE · NO FLOOR LEFT UNINSPECTED</div>
</main>
<script>
const target=Date.UTC(2026,10,4,23,0,0);
const el=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function tick(){
 let left=target-Date.now();
 if(left<=0){['days','hours','minutes','seconds'].forEach(id=>el(id).textContent='00');el('status').textContent='THE GATES ARE OPEN. FOR THE HORDE!';return}
 const d=Math.floor(left/86400000);left%=86400000;
 const h=Math.floor(left/3600000);left%=3600000;
 const m=Math.floor(left/60000);const s=Math.floor((left%60000)/1000);
 el('days').textContent=d;el('hours').textContent=pad(h);el('minutes').textContent=pad(m);el('seconds').textContent=pad(s);
}
tick();setInterval(tick,1000);
el('copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);el('copyLink').textContent='Link copied!'}catch{el('copyLink').textContent='Copy from address bar'}});
el('copyDiscord').addEventListener('click',async()=>{const t='⚔️ **FLOOR INSPECTORS — THE HORDE IS GATHERING** ⚔️\nWoW Forever arrives <t:1793833200:F> (<t:1793833200:R>)\nSharpen your blades. No floor left uninspected.';try{await navigator.clipboard.writeText(t);el('copyDiscord').textContent='Announcement copied!'}catch{el('copyDiscord').textContent='Copy unavailable'}});
</script>
</body>
</html>
